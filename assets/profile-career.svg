ity assurance for the first batch of AI Specialists (annotators).</text><text x="72" y="510" font-size="19" fill="#D9DEEC" font-weight="400">Oversaw AI evaluation quality, annotation operations and team performance.</text><text x="72" y="537" font-size="19" fill="#D9DEEC" font-weight="400">Managed 1,000+ evaluations weekly; led calibration, onboarding</text><text x="72" y="564" font-size="19" fill="#D9DEEC" font-weight="400">and quality improvement.</text><rect x="48" y="616" width="1104" height="174" rx="12" fill="#202A42" stroke="#36425F"/><text x="72" y="652" font-size="25" fill="#F4F4FF" font-weight="600">EDs Resources</text><text x="838" y="650" font-size="17" fill="#ACB8D0" font-weight="400">Aug 2019 – Aug 2024</text><text x="72" y="688" font-size="20" fill="#C4B5FD" font-weight="500">Freelance AI Chatbot Developer &amp; Project Lead</text><text x="72" y="725" font-size="19" fill="#D9DEEC" font-weight="400">Delivered client projects from discovery through build, testing and launch.</text><text x="72" y="752" font-size="19" fill="#D9DEEC" font-weight="400">Developed conversational AI solutions and API/webhook integrations.</text><rect x="48" y="812" width="1104" height="154" rx="12" fill="#202A42" stroke="#36425F"/><text x="72" y="848" font-size="25" fill="#F4F4FF" font-weight="600">Grab</text><text x="838" y="846" font-size="17" fill="#ACB8D0" font-weight="400">Aug 2018 – Apr 2019</text><text x="72" y="884" font-size="20" fill="#C4B5FD" font-weight="500">Customer Experience Agent · Singapore Market</text><text x="72" y="921" font-size="19" fill="#D9DEEC" font-weight="400">Handled voice, chat and email interactions against quality,</text><text x="72" y="948" font-size="19" fill="#D9DEEC" font-weight="400">compliance and productivity targets.</text><text x="48" y="1021" font-size="14" fill="#8BE4D1" font-weight="600">EDUCATION</text><rect x="48" y="1048" width="540" height="210" rx="12" fill="#202A42" stroke="#36425F"/><text x="72" y="1092" font-size="25" fill="